version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medical-attendance-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: medical_attendance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medical-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medical-attendance-api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/medical_attendance
      - NODE_ENV=development
      - JWT_SECRET=${JWT_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - AI_SERVICE_URL=http://ai-service:5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - medical-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medical-attendance-web
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:3001
      - REACT_APP_ENV=development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - medical-network

  ai-service:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: medical-attendance-ai
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./ai-services:/app
      - ./uploads:/app/uploads
    networks:
      - medical-network
    command: python app.py

volumes:
  postgres_data:

networks:
  medical-network:
    driver: bridge
